<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; margin:0; }
    header { background:#ff6600; color:white; padding:15px; text-align:center; font-size:24px; font-weight:bold; }
    .cart { margin:40px auto; width:80%; background:white; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); }
    table { width:100%; border-collapse:collapse; }
    th, td { padding:10px; border-bottom:1px solid #ddd; text-align:left; }
    th { background:#ff6600; color:white; }
    #total { text-align:right; font-weight:bold; margin-top:10px; }
    .checkout-btn { margin-top:15px; padding:12px 20px; background:#ff6600; color:white; border:none; border-radius:6px; cursor:pointer; font-weight:bold; }
    .checkout-btn:hover { background:#e65c00; }
    .remove-btn { background:red; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer; }
    .remove-btn:hover { background:darkred; }
  </style>
</head>
<body>
  <header>My Cart</header>
  <div class="cart">
    <h2>View Cart</h2>
    <table id="cartTable">
      <thead>
        <tr><th>Fruit</th><th>Price</th><th>Qty</th><th>Subtotal</th><th>Action</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="total">Total: ₹0</div>
    <button class="checkout-btn" onclick="goToBilling()">Checkout</button>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    function removeFromCart(name) {
      cart = cart.filter(item => item.name !== name);
      localStorage.setItem("cart", JSON.stringify(cart));
      loadCart();
    }

    function loadCart() {
      const tbody = document.querySelector("#cartTable tbody");
      tbody.innerHTML = "";
      let total = 0;
      cart.forEach(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        tbody.innerHTML += `<tr>
          <td>${item.name}</td>
          <td>₹${item.price}/${item.unit}</td>
          <td>${item.qty}</td>
          <td>₹${subtotal}</td>
          <td><button class="remove-btn" onclick="removeFromCart('${item.name}')">Remove</button></td>
        </tr>`;
      });
      document.getElementById("total").textContent = "Total: ₹" + total;
    }

    function goToBilling() { window.location.href = "billing.html"; }

    loadCart();
  </script>
</body>
</html>
