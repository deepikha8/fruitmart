<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      padding:20px;
    }
    h1 {
      color:#ff6600;
      text-align:center;
    }
    table {
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
      background:white;
      box-shadow:0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
      border:1px solid #ddd;
      padding:10px;
      text-align:center;
    }
    th {
      background:#ff6600;
      color:white;
    }
    img {
      width:80px;
      height:80px;
      object-fit:cover;
      border-radius:6px;
    }
    button {
      background:#ff6600;
      color:white;
      border:none;
      padding:6px 10px;
      border-radius:4px;
      cursor:pointer;
      font-weight:bold;
    }
    button:hover {
      background:#e65c00;
    }
    .top-actions {
      text-align:center;
      margin-top:20px;
    }
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <p style="text-align:center;">Welcome, Deepikha!</p>

  <div class="top-actions">
    <button onclick="clearFruits()">Delete All Fruits</button>
  </div>

  <table id="fruitTable">
    <thead>
      <tr>
        <th>Image</th>
        <th>Name</th>
        <th>Price</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody>
      <!-- Seller fruits will load here -->
    </tbody>
  </table>

  <script>
    // Load fruits from localStorage
    let fruits = JSON.parse(localStorage.getItem("fruits")) || [];
    const tableBody = document.querySelector("#fruitTable tbody");

    function renderTable() {
      tableBody.innerHTML = "";
      fruits.forEach((fruit, index) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td><img src="${fruit.image}" alt="${fruit.name}"></td>
          <td>${fruit.name}</td>
          <td>₹${fruit.price} / kg</td>
          <td><button onclick="deleteFruit(${index})">Delete</button></td>
        `;
        tableBody.appendChild(row);
      });
    }

    function deleteFruit(index) {
      fruits.splice(index, 1);
      localStorage.setItem("fruits", JSON.stringify(fruits));
      renderTable();
      alert("Fruit deleted!");
    }

    function clearFruits() {
      localStorage.removeItem("fruits");
      fruits = [];
      renderTable();
      alert("All fruits deleted!");
    }

    // Initial render
    renderTable();
  </script>
</body>
</html>
