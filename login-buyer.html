<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buyer Login</title>
  <style>
    body { font-family: Arial; margin:0; background:url('https://images.unsplash.com/photo-1567306226416-28f0efdc88ce') no-repeat center/cover; }
    .container { width:400px; margin:80px auto; background:rgba(255,102,0,0.9); padding:30px; border-radius:12px; color:white; box-shadow:0 0 20px rgba(0,0,0,0.5); }
    h2 { text-align:center; margin-bottom:20px; }
    input { width:100%; padding:12px; margin:10px 0; border:none; border-radius:6px; }
    button { width:100%; padding:12px; background:white; color:#ff6600; font-weight:bold; border:none; border-radius:6px; cursor:pointer; transition:0.3s; }
    button:hover { background:#ffe0cc; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Buyer Login</h2>
    <form action="buy.html" method="get">
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Login as Buyer</button>
    </form>
  </div>
</body>
</html>
