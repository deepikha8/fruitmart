<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buyer Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin:0;
      background:url('https://images.unsplash.com/photo-1567306226416-28f0efdc88ce') no-repeat center/cover;
    }
    .container {
      width:400px;
      margin:80px auto;
      background:rgba(255,102,0,0.9);
      padding:30px;
      border-radius:12px;
      color:white;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }
    h2 { text-align:center; margin-bottom:20px; }
    input {
      width:100%; padding:12px; margin:10px 0;
      border:none; border-radius:6px;
    }
    button {
      width:100%; padding:12px;
      background:white; color:#ff6600;
      font-weight:bold; border:none; border-radius:6px;
      cursor:pointer; transition:0.3s;
    }
    button:hover { background:#ffe0cc; }
    #message {
      text-align:center;
      margin-top:15px;
      font-weight:bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Buyer Login</h2>
    <form onsubmit="login(event)">
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Login as Buyer</button>
    </form>
    <p id="message"></p>
  </div>

  <script>
    function login(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const savedEmail = localStorage.getItem("buyerEmail");
      const savedPassword = localStorage.getItem("buyerPassword");

      if (!savedEmail || !savedPassword) {
        document.getElementById("message").textContent = "No registration found!";
      } else if (email !== savedEmail || password !== savedPassword) {
        document.getElementById("message").textContent = "Wrong email or password!";
      } else {
        // Redirect to dashboard
        window.location.href = "buyer-dashboard.html";
      }
    }
  </script>
</body>
</html>
