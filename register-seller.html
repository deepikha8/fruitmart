<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seller Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin:0;
      /* Fruit market background */
      background:url('https://images.unsplash.com/photo-1506806732259-39c2d0268443') no-repeat center/cover;
    }
    .container {
      width:400px;
      margin:80px auto;
      background:rgba(255,102,0,0.9); /* orange overlay */
      padding:30px;
      border-radius:12px;
      color:white;
      box-shadow:0 0 20px rgba(0,0,0,0.5);
    }
    h2 {
      text-align:center;
      margin-bottom:20px;
      text-shadow:2px 2px 6px rgba(0,0,0,0.7);
    }
    input {
      width:100%;
      padding:12px;
      margin:10px 0;
      border:none;
      border-radius:6px;
    }
    button {
      width:100%;
      padding:12px;
      background:white;
      color:#ff6600;
      font-weight:bold;
      border:none;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }
    button:hover {
      background:#ffe0cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Seller Registration</h2>
    <form action="sell.html" method="post">
      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button type="submit">Register as Seller</button>
    </form>
  </div>
</body>
</html>
